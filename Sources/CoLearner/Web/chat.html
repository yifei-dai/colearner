<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-learner chat</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="chat.css">
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/marked.umd.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="render.js"></script>
<script src="slide_links.js"></script>
</head>
<body>
<header id="head">
  <div id="where">
    <span id="where-deck">No slides open</span>
    <span id="where-slide"></span>
  </div>
  <div id="head-actions">
    <div id="viewseg" role="radiogroup" aria-label="Show">
      <button data-v="slide" role="radio" title="Messages asked on this slide">This slide</button>
      <button data-v="all" role="radio" title="The whole conversation about this deck">All</button>
    </div>
    <button id="btn-history" class="ghost" title="Earlier chats about this deck">History ⌄</button>
    <button id="btn-new" class="ghost" title="Start a fresh chat about this deck (this one stays in History)">New chat</button>
  </div>
  <button id="btn-search" class="ghost" title="Search chats across all lecture decks (⇧⌘F)" aria-label="Search all chats">Search</button>
</header>
<div id="others" hidden>
  <span class="others-label">Also asked on slides:</span>
  <span id="others-list"></span>
</div>

<main id="log" aria-live="polite"></main>

<footer id="composer">
  <div id="quick">
    <button class="chip" data-action="explain">Explain this slide</button>
    <button class="chip" data-action="visualize">Visualize this slide</button>
    <button class="chip ghostchip" id="btn-area" title="Drag a box over part of the slide (or hold ⌥ and drag on the slide; ⌘⇧A)">✂︎ Select area</button>
    <button class="chip ghostchip" id="btn-attach" title="Attach screenshots or other pictures (or paste one with ⌘V, or drop files on the chat)">📎 Screenshot</button>
  </div>
  <div id="areabox" hidden>
    <img id="area-img" alt="">
    <span id="area-label"></span>
    <button id="area-clear" class="ghost" title="Remove the selected area">✕</button>
  </div>
  <div id="attachbox" hidden></div>
  <div id="inputwrap">
    <textarea id="input" rows="2" placeholder="Ask about this slide…  (Enter to send, Shift+Enter for a new line)"></textarea>
  </div>
  <div id="bar">
    <div id="providers" role="radiogroup" aria-label="Ask">
      <button data-p="claude" role="radio">Claude</button>
      <button data-p="codex" role="radio">ChatGPT</button>
      <button data-p="both" role="radio">Both</button>
    </div>
    <span id="pickers"></span>
    <span class="grow"></span>
    <button id="btn-send" class="primary">Send</button>
  </div>
  <div id="note" role="status" aria-live="polite"></div>
  <div id="status">
    <span id="attach" title="The current slide image and text are sent with your first question on this slide"></span>
    <span class="grow"></span>
    <button id="usage" title="Plan usage: click for details"></button>
  </div>
</footer>
<div id="search-layer" hidden>
  <section id="search-dialog" role="dialog" aria-modal="true" aria-labelledby="search-title">
    <div class="search-heading">
      <h2 id="search-title">Search all chats</h2>
      <button id="search-close" class="ghost" title="Close search (Esc)" aria-label="Close search">✕</button>
    </div>
    <label class="search-label" for="search-input">Search your questions and answers across lecture decks</label>
    <input id="search-input" type="search" placeholder="Find a topic, question, or explanation…" autocomplete="off" spellcheck="false">
    <div id="search-status" role="status" aria-live="polite">Type to search your saved chats.</div>
    <div id="search-results" aria-label="Search results"></div>
  </section>
</div>
<div id="drop-layer" hidden><span id="drop-text">Drop screenshots or pictures to attach</span></div>
<script src="chat.js"></script>
</body>
</html>
